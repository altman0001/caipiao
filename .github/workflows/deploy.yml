# 每日自动刷新开奖数据并重新构建、发布到 GitHub Pages
# 触发：push 到 main；或每天 04:30 / 14:30 / 22:30 (UTC) 定时运行（北京时间 12:30 / 22:30 / 次日 06:30）
# 产物结构（gh-pages 分支）：
#   index.html  落地页（PC / H5 两个入口）
#   pc/          React + Vite 版（PC），入口 https://altman0001.github.io/caipiao/pc
#   h5/          UniApp 版（手机 H5），入口 https://altman0001.github.io/caipiao/h5
name: deploy-pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 14 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch & rebuild dataset (SQLite -> webapp/src/data.js + h5/src/common/data.js)
        run: |
          python build_db.py
          python export.py
        shell: bash

      - name: Regenerate predictions & evaluate hits
        run: node scripts/update_predictions.mjs
        shell: bash

      - name: Commit prediction history to main
        run: |
          git add predictions/ssq.json predictions/dlt.json
          if git diff --cached --quiet; then
            echo "::notice::prediction history unchanged"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(data): 更新预测历史与命中判定"
            git push origin HEAD:main
            echo "::notice::prediction history committed and pushed"
          fi
        shell: bash

      - name: Build PC frontend
        working-directory: webapp
        run: |
          npm ci
          npm run build
        shell: bash

      - name: Stage PC build to gh-pages/pc
        run: |
          mkdir -p dist_pages/pc
          cp -r webapp/dist/. dist_pages/pc/
        shell: bash

      - name: Build H5 frontend (UniApp)
        working-directory: h5
        run: |
          npm ci
          npm run build:h5
        shell: bash

      - name: Stage H5 build to gh-pages/h5
        run: |
          mkdir -p dist_pages/h5
          cp -r h5/dist/build/h5/. dist_pages/h5/
        shell: bash

      - name: Write landing page (index.html)
        run: |
          cat > dist_pages/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>彩研 · 大乐透/双色球 规律分析</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 44px; color: #e8eefb; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
                background:
                  radial-gradient(900px 420px at 85% -6%, rgba(74,107,255,.14), transparent 60%),
                  radial-gradient(700px 360px at -14% 4%, rgba(255,77,109,.10), transparent 55%),
                  #0b0f1c;
              }
              .logo {
                width: 64px; height: 64px; position: relative; margin: 0 auto 18px;
                filter: drop-shadow(0 8px 14px rgba(255,77,109,.45));
              }
              .logo i { position: absolute; border-radius: 50%; display: block; }
              .logo i.r { width: 44px; height: 44px; background: radial-gradient(circle at 32% 30%, #ff8aa0, #ff4d6d); left: 0; top: 10px; }
              .logo i.b { width: 38px; height: 38px; background: radial-gradient(circle at 32% 30%, #8fd0ff, #4dabff); right: 0; bottom: 4px; opacity: .95; }
              h1 { font-size: 30px; font-weight: 750; text-align: center; letter-spacing: 1px; }
              h1 span { color: #ff6b81; }
              .sub { margin-top: 10px; font-size: 14px; color: #5d6a8c; text-align: center; letter-spacing: 2px; }
              .links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
              a {
                display: block; min-width: 220px; text-align: center; padding: 22px 34px; border-radius: 14px;
                text-decoration: none; font-size: 16px; font-weight: 700; color: #e8eefb;
                background: linear-gradient(135deg, #1a2340, #141b30); border: 1px solid rgba(148,163,190,.18);
                box-shadow: 0 10px 30px -14px rgba(0,0,0,.55); transition: transform .18s, border-color .18s;
              }
              a:hover { transform: translateY(-3px); border-color: #ff6b81; }
              a small { display: block; margin-top: 6px; font-size: 12px; font-weight: 500; color: #5d6a8c; }
              .tip { font-size: 12px; color: #42506f; text-align: center; }
            </style>
          </head>
          <body>
            <div>
              <div class="logo"><i class="r"></i><i class="b"></i></div>
              <h1>彩研<span>·</span>规律分析</h1>
              <div class="sub">大乐透 · 双色球 历史开奖数据中心</div>
            </div>
            <div class="links">
              <a href="./pc/">电脑版（PC）<small>桌面浏览器访问</small></a>
              <a href="./h5/">手机版（H5）<small>手机浏览器访问</small></a>
            </div>
            <div class="tip">体彩 / 福彩开奖为随机独立事件，历史数据仅供规律研究，不构成投注建议。</div>
          </body>
          </html>
          EOF
          echo "::notice::landing page written"
        shell: bash

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist_pages
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"