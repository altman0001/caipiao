# 每日自动刷新开奖数据并重新构建、发布到 GitHub Pages
# 触发：push 到 main；或每天 04:30 / 14:30 / 22:30 (UTC) 定时运行（北京时间 12:30 / 22:30 / 次日 06:30）
name: deploy-pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 14 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch & rebuild dataset (SQLite -> src/data.js)
        run: |
          python build_db.py
          python export.py
        shell: bash

      - name: Regenerate predictions & evaluate hits
        run: node scripts/update_predictions.mjs
        shell: bash

      - name: Commit prediction history to main
        run: |
          git add predictions/ssq.json predictions/dlt.json
          if git diff --cached --quiet; then
            echo "::notice::prediction history unchanged"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(data): 更新预测历史与命中判定"
            git push origin HEAD:main
            echo "::notice::prediction history committed and pushed"
          fi
        shell: bash

      - name: Build frontend
        working-directory: webapp
        run: |
          npm ci
          npm run build
        shell: bash

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: webapp/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"